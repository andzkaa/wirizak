<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" role="img" aria-label="WIR&amp;ZAK">
  <style>
    .wz-txt { font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif; font-weight: 900; }
  </style>
  <text x="0" y="118" class="wz-txt" font-size="118" fill="currentColor" letter-spacing="2">WIR</text>
  <!-- ampersand with house roof motif -->
  <g transform="translate(232,18)">
    <text x="0" y="100" class="wz-txt" font-size="120" fill="currentColor">&amp;</text>
    <!-- little house -->
    <path d="M14 96 L52 64 L90 96" fill="none" stroke="currentColor" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    <rect x="34" y="86" width="14" height="12" fill="currentColor"/>
    <rect x="56" y="86" width="14" height="12" fill="currentColor"/>
  </g>
  <text x="350" y="118" class="wz-txt" font-size="118" fill="currentColor" letter-spacing="2">ZAK</text>
  <text x="2" y="170" font-family="Arial, sans-serif" font-weight="700" font-size="30" letter-spacing="6" fill="currentColor">ELEKTRYKA &amp; AUTOMATYKA</text>
</svg>
